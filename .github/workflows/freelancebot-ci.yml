name: FreelanceBot CI

on:
  push:
    paths:
      - "ai-freelancer-bot/**"
      - ".github/workflows/freelancebot-ci.yml"
  pull_request:
    paths:
      - "ai-freelancer-bot/**"
      - ".github/workflows/freelancebot-ci.yml"

defaults:
  run:
    working-directory: ai-freelancer-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai-freelancer-bot/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
