name: YouTube Shorts — Daily

on:
  schedule:
    - cron: "0 7 * * *"   # 09:00 Europe/Amsterdam (CEST)
  workflow_dispatch:

jobs:
  daily-short:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bootstrap video engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: bash projects/why-we-do-this/bootstrap.sh

      - name: Run daily Short pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          cd projects/why-we-do-this/faceless-video-engine
          python3 run_daily.py --no-upload

      - name: Upload output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-${{ github.run_id }}
          path: projects/why-we-do-this/faceless-video-engine/output/*.mp4
          if-no-files-found: ignore
