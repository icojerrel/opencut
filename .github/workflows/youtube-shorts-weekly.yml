name: YouTube Shorts — Weekly Long-form

on:
  schedule:
    - cron: "0 12 * * 0"  # Sunday 14:00 Europe/Amsterdam (CEST)
  workflow_dispatch:

jobs:
  weekly-longform:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bootstrap video engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: bash .cursor/automations/youtube-shorts/bootstrap.sh

      - name: Run weekly long-form pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd faceless-video-engine
          python3 run_weekly.py --no-upload

      - name: Upload output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-longform-${{ github.run_id }}
          path: faceless-video-engine/output/*.mp4
          if-no-files-found: ignore
