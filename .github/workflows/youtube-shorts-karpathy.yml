name: YouTube Shorts — Karpathy Loop

on:
  schedule:
    - cron: "0 21 * * *"  # 23:00 Europe/Amsterdam (CEST)
  workflow_dispatch:

jobs:
  karpathy-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bootstrap video engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: bash .cursor/automations/youtube-shorts/bootstrap.sh

      - name: Run Karpathy autoresearch loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd faceless-video-engine
          python3 run_karpathy_loop.py

      - name: Upload review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karpathy-review-${{ github.run_id }}
          path: faceless-video-engine/data/karpathy_review/
          if-no-files-found: ignore
